#
# Build and test the extension using the DuckDB reusable CI workflow.
# Require the legacy release and the pinned DuckDB 2.0 release to build and test.
# DuckDB main is checked separately by the scheduled canary workflow.
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1-5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: false

jobs:
  duckdb-stable-build:
    name: Build DuckDB v1.5.5 extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: yardstick
      extra_toolchains: rust
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;linux_amd64_gcc4;windows_amd64_rtools;windows_amd64_mingw"

  duckdb-release-build:
    name: Build DuckDB v2.0.0 extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@fe955ed3a046b0324cac2c691e73d8d776a7d5cc
    with:
      duckdb_version: v2.0.0
      duckdb_commit: d54cbbe3df17e8e5ce68312f483b4155836112aa
      ci_tools_version: fe955ed3a046b0324cac2c691e73d8d776a7d5cc
      test_config: '{"test_env_variables":{"YARDSTICK_NATIVE_PEG":"1"}}'
      extension_name: yardstick
      extra_toolchains: rust
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;linux_amd64_gcc4;windows_amd64_rtools;windows_amd64_mingw"
      opt_in_archs: osx_amd64
      reduced_ci_mode: disabled
